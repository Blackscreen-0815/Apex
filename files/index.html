      theme: {
        extend: {
          colors: {
            bg: 'rgb(var(--bg) / <alpha-value>)',

            label: 'rgb(var(--label) / <alpha-value>)',

            sep: 'rgb(var(--sep) / var(--sep-a))',

            green: 'rgb(var(--green) / <alpha-value>)',
            orange: 'rgb(var(--orange) / <alpha-value>)',
            red: 'rgb(var(--red) / <alpha-value>)'
          }
        }
      }

  .switch { position: relative; display: inline-block; height: 31px; width: 51px; flex-shrink: 0; border-radius: 999px; background: rgb(var(--switch-off)); transition: background .2s; }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; height: 27px; width: 27px; border-radius: 50%; background: #fff;

  }
  .switch.on { background: rgb(var(--green)); }
  .switch.on::after { transform: translateX(20px); }
  .swatch { position: relative; border-radius: 16px; padding: 12px; text-align: left; border: 2px solid transparent; }
  .swatch[aria-checked="true"] { border-color: rgb(var(--accent)); }
  .hrange { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 30px; margin: 0; background: transparent; --f: 0; --fill: rgb(var(--accent)); touch-action: pan-y; }
  .hrange.done { --fill: rgb(var(--green)); }
  .hrange:focus { outline: none; }
  .hrange::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: linear-gradient(to right, var(--fill) 0 calc(13px + (100% - 26px) * var(--f)), rgb(var(--well) / calc(var(--well-a) * 1.7)) 0); }
  .hrange::-moz-range-track { height: 6px; border-radius: 999px; background: linear-gradient(to right, var(--fill) 0 calc(13px + (100% - 26px) * var(--f)), rgb(var(--well) / calc(var(--well-a) * 1.7)) 0); }
  .hrange::-webkit-slider-thumb { -webkit-appearance: none; height: 26px; width: 26px; margin-top: -10px; border-radius: 50%; background: #fff; box-shadow: 0 2px 7px rgba(0, 0, 0, .28), 0 0 0 .5px rgba(0, 0, 0, .08); }
  .hrange::-moz-range-thumb { height: 26px; width: 26px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 2px 7px rgba(0, 0, 0, .28), 0 0 0 .5px rgba(0, 0, 0, .08); }
  .hrange:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgb(var(--accent) / .5); }
  .sheet { --bg: var(--sheet-bg); --card: var(--sheet-card); background: rgb(var(--bg)); }

  details > summary { list-style: none; cursor: pointer; }

  :focus-visible { outline: 2px solid rgb(var(--accent)); outline-offset: 2px; }
  input:focus-visible, select:focus-visible { outline: none; }
  .scrollbar-none { scrollbar-width: none; }
  .scrollbar-none::-webkit-scrollbar { display: none; }

  .sheet-enter { animation: sheetUp .3s cubic-bezier(.2, .8, .2, 1); }
  @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .toast-enter { animation: toastIn .25s cubic-bezier(.2, .8, .2, 1); }
  @keyframes toastIn { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .pop { animation: pop .28s ease; }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  #flash { opacity: 0; }

  @keyframes flashFade { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {

<script>
'use strict';
/* =====================================================================
   APEX – Single-File PWA
   1 Utils, Sprache, Einheiten   2 Übungen, Plan, Texte   3 Speicher
   4 Logik   5 UI-Bausteine   6 Views   7 Tools   8 Timer   9 Aktionen   10 Start
   ===================================================================== */

/* ---------- 1 · Utils, Sprache, Einheiten ---------- */
const APP_NAME = 'Apex';
const APP_VERSION = '2.0.0';
const STORE_KEY = 'apex:data';
const LEGACY_KEY = 'hypertrophy-pro:data';
const XP = { set: 10, beat: 5, pr: 25, finish: 50, habit: 5, habitAll: 10 };
const LEVEL_BASE = 150;
const MAX_GAP_DAYS = 4; // mehr als 3 Ruhetage am Stück beenden die Serie
const LB_PER_KG = 2.20462262;
const CM_PER_IN = 2.54;
/* In der claude.ai-Vorschau gibt es window.claude.use, selbst gehostet nicht */
const PREVIEW = !!(window.claude && typeof window.claude.use === 'function');

let LANG = 'de';
let UNITS = 'metric';
const LOCALE = () => (LANG === 'en' ? 'en-US' : 'de-DE');

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = (p = 'id') => `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
const pad2 = (n) => String(n).padStart(2, '0');
const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);

/* Übersetzung: Schlüssel aus I18N, Werte sind Texte mit {platzhalter} oder Funktionen */
function t(key, vars = {}) {
  let v = (I18N[LANG] || I18N.de)[key];
  if (v === undefined) v = I18N.de[key];
  if (v === undefined) return key;
  if (typeof v === 'function') return v(vars);
  return v.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
}
/* Lokalisiertes Feld {de, en} oder einfacher Text */
function L(v) { return v && typeof v === 'object' && !Array.isArray(v) ? (v[LANG] ?? v.de) : v; }

function num(v) {
  if (v === '' || v === null || v === undefined) return NaN;
  const n = parseFloat(String(v).trim().replace(',', '.'));
  return Number.isFinite(n) ? n : NaN;
}
function fmtNum(n, maxDec = 2) {
  if (!Number.isFinite(n)) return '–';
  return n.toLocaleString(LOCALE(), { maximumFractionDigits: maxDec, useGrouping: false });
}
function fmtInt(n) { return Math.round(n).toLocaleString(LOCALE()); }

/* Gewichte werden immer in kg gespeichert und nur für die Anzeige umgerechnet */
const imperial = () => UNITS === 'imperial';
const wUnit = () => (imperial() ? 'lb' : 'kg');
const toDisp = (kg) => (imperial() ? kg * LB_PER_KG : kg);
const toKg = (d) => (imperial() ? d / LB_PER_KG : d);
const roundDisp = (x) => (imperial() ? Math.round(x * 10) / 10 : Math.round(x * 100) / 100);
const kgStr = (kg) => String(Math.round(kg * 10000) / 10000);
function fmtDispV(d) { return fmtNum(roundDisp(d), imperial() ? 1 : 2); }
function fmtDisp(d) { return `${fmtDispV(d)} ${wUnit()}`; }
function fmtWv(kg) { return fmtDispV(toDisp(kg)); }
function fmtW(kg) { return `${fmtWv(kg)} ${wUnit()}`; }
function fmtWprose(kg) {
  if (!imperial()) return `${fmtNum(kg)} kg`;
  const lb = kg * LB_PER_KG;
  return `${lb >= 10 ? Math.round(lb) : fmtNum(Math.round(lb * 10) / 10, 1)} lb`;
}
function fmtVolume(kg) {
  if (imperial()) { const lb = kg * LB_PER_KG; return lb >= 10000 ? `${fmtNum(lb / 1000, 1)}k lb` : `${fmtInt(lb)} lb`; }
  return kg >= 1000 ? `${fmtNum(kg / 1000, 1)} t` : `${fmtInt(kg)} kg`;
}
function fmtHeight(cm) {
  if (!imperial()) return `${fmtNum(cm, 0)} cm`;
  const total = cm / CM_PER_IN;
  let ft = Math.floor(total / 12), inch = Math.round(total - ft * 12);
  if (inch === 12) { ft++; inch = 0; }
  return `${ft}′${inch}″`;
}
/* Platzhalter in Übungstexten: {w:10} Gewicht, {wr:20-30} Gewichtsbereich, {lr:60-80} Längenbereich */
function wt(str) {
  return String(str ?? '')
    .replace(/\{w:([\d.]+)\}/g, (m, n) => fmtWprose(parseFloat(n)))
    .replace(/\{wr:([\d.]+)-([\d.]+)\}/g, (m, a, b) => (imperial()
      ? `${Math.round(a * LB_PER_KG)}–${Math.round(b * LB_PER_KG)} lb` : `${fmtNum(+a)}–${fmtNum(+b)} kg`))
    .replace(/\{lr:([\d.]+)-([\d.]+)\}/g, (m, a, b) => (imperial()
      ? `${Math.round(a / CM_PER_IN)}–${Math.round(b / CM_PER_IN)} in` : `${a}–${b} cm`));
}

function isoDate(d = new Date()) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function parseISO(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function diffDays(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoDate(d); }
function mondayOf(iso) { const d = parseISO(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoDate(d); }
function fmtDate(iso, opts = { day: '2-digit', month: '2-digit' }) { return parseISO(iso).toLocaleDateString(LOCALE(), opts); }
function fmtDur(sec) { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${pad2(sec % 60)}`; }
function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${pad2(m)}:${pad2(sec)}` : `${m}:${pad2(sec)}`;
}

/* ---------- 3 · Speicher (localStorage) ---------- */
function defaultPlates() {
  return {
    kg: { bar: 10, inv: [{ w: 20, count: 0 }, { w: 15, count: 0 }, { w: 10, count: 2 }, { w: 5, count: 2 }, { w: 2.5, count: 2 }, { w: 1.25, count: 0 }, { w: 0.5, count: 0 }] },

  };
}
function defaultState() {
  return {
    version: 2,
    createdAt: Date.now(),
    profile: { bodyweight: 82, height: 186, age: 29 },
    settings: {
      lang: 'de', units: 'metric', theme: 'charcoal', accent: 'orange', roseMode: 'dark',

    },

    sessions: [],

  };
}

function planItemFor(dayKey, exId) {
  const it = PLAN[dayKey] && PLAN[dayKey].items.find((x) => x.ex === exId);
  return it ? { ...it } : null;
}
function cleanInv(list, fallback) {
  const out = (Array.isArray(list) ? list : [])
    .map((p) => ({ w: +(p.w ?? p.kg), count: Math.max(0, Math.round(+p.count || 0)) }))
    .filter((p) => Number.isFinite(p.w) && p.w > 0);
  return out.length ? out : fallback;
}

function migrate(raw) {
  const base = defaultState();
  if (!raw || typeof raw !== 'object') return base;
  const rs = raw.settings || {};
  const d = { ...base, ...raw };
  d.profile = { ...base.profile, ...(raw.profile || {}) };
  d.settings = { ...base.settings, ...rs };
  if (!['de', 'en'].includes(d.settings.lang)) d.settings.lang = 'de';
  if (!['metric', 'imperial'].includes(d.settings.units)) d.settings.units = 'metric';
  if (!['charcoal', 'rose', 'baby'].includes(d.settings.theme)) d.settings.theme = 'charcoal';
  if (!ACCENTS[d.settings.accent]) d.settings.accent = 'orange';
  if (!['dark', 'light'].includes(d.settings.roseMode)) d.settings.roseMode = 'dark';
  /* Scheiben: altes Format (Hypertrophy Pro) {bar, vest, inventory[kg]} wird übernommen */
  const dp = defaultPlates(), rp = rs.plates || {};
  if (Array.isArray(rp.inventory)) {
    d.settings.plates = { kg: { bar: +rp.bar || dp.kg.bar, inv: cleanInv(rp.inventory, dp.kg.inv) }, lb: dp.lb };
    if (Number.isFinite(+rp.vest)) d.settings.vestKg = +rp.vest;
  } else {
    d.settings.plates = {
      kg: { bar: Number.isFinite(+(rp.kg && rp.kg.bar)) ? +rp.kg.bar : dp.kg.bar, inv: cleanInv(rp.kg && rp.kg.inv, dp.kg.inv) },
      lb: { bar: Number.isFinite(+(rp.lb && rp.lb.bar)) ? +rp.lb.bar : dp.lb.bar, inv: cleanInv(rp.lb && rp.lb.inv, dp.lb.inv) }
    };
  }
  if (!(+d.settings.vestKg >= 0)) d.settings.vestKg = 10;
  if (!Array.isArray(d.settings.weekMap) || d.settings.weekMap.length !== 7) d.settings.weekMap = base.settings.weekMap.slice();
  d.settings.weekMap = d.settings.weekMap.map((k) => (k === 'REST' || PLAN[k] ? k : 'REST'));
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.settings.mesoStart || '')) d.settings.mesoStart = base.settings.mesoStart;
  d.tools = { ...base.tools, ...(raw.tools || {}) };
  d.meta = { ...base.meta, ...(raw.meta || {}) };
  d.sessions = Array.isArray(raw.sessions)
    ? raw.sessions
      .filter((s) => s && s.id && PLAN[s.dayKey] && Array.isArray(s.exercises))
      .map((s) => ({
        ...s,
        week: clamp(Math.round(+s.week || 1), 1, 5),
        exercises: s.exercises
          .filter((e) => e && EX[e.exId] && Array.isArray(e.sets))
          .map((e) => ({
            ...e,
            plan: e.plan || planItemFor(s.dayKey, e.exId) || { ex: e.exId, sets: e.sets.length, min: 8, max: 15, tempo: '2-0-1-0', rest: 90, cat: 'i' },
            sets: e.sets.filter(Boolean).map((x) => {
              const kg = num(x.kg);
              return { kg: Number.isFinite(kg) ? kgStr(kg) : '', reps: String(x.reps ?? ''), done: !!x.done, beat: !!x.beat, ts: x.ts || null };
            })
          }))
      }))
    : [];
  d.habits = raw.habits && typeof raw.habits === 'object' ? raw.habits : {};
  d.bodyweight = Array.isArray(raw.bodyweight)
    ? raw.bodyweight.filter((e) => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && Number.isFinite(+e.kg)).map((e) => ({ date: e.date, kg: +e.kg }))
    : [];
  if (d.activeId && !d.sessions.some((s) => s.id === d.activeId && !s.finishedAt)) d.activeId = null;
  if (d.timer && !(d.timer.endAt > 0)) d.timer = null;
  d.version = 2;
  return d;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(LEGACY_KEY);
    return raw ? migrate(JSON.parse(raw)) : defaultState();
  } catch (err) {
    console.error('Laden fehlgeschlagen', err);
    return defaultState();
  }
}

let S = null;
let saveTimer = null;
function save(immediate = false) {
  clearTimeout(saveTimer);
  const run = () => {

/* ---------- 4 · Logik ---------- */
const activeSession = () => (S.activeId ? S.sessions.find((s) => s.id === S.activeId && !s.finishedAt) || null : null);
const finishedSessions = () => S.sessions.filter((s) => s.finishedAt).sort((a, b) => a.startedAt - b.startedAt);
const newSet = () => ({ kg: '', reps: '', done: false, beat: false, ts: null });

function currentBW() {
  if (!S.bodyweight.length) return S.profile.bodyweight;
  return S.bodyweight.slice().sort((a, b) => a.date.localeCompare(b.date))[S.bodyweight.length - 1].kg;
}
function epley(w, r) {
  if (!(w > 0) || !(r > 0)) return 0;
  return r === 1 ? w : w * (1 + r / 30);
}
/* Rekordwertung: geschätztes 1RM inkl. Körpergewichtsanteil, ohne Last zählen die Wiederholungen */
function setMetric(exId, set, bw) {
  const ex = EX[exId]; if (!ex) return 0;
  const kg = num(set.kg) || 0, reps = num(set.reps) || 0;
  const eff = kg + (ex.bw || 0) * bw;
  return eff > 0 ? epley(eff, reps) : reps;
}
function beats(kg, reps, gkg, greps) {
  return (kg > gkg + 1e-6 && reps >= greps) || (kg >= gkg - 1e-6 && reps > greps);
}
function ghostFor(exId, dayKey, excludeId) {
  const list = S.sessions.filter((s) => s.finishedAt && s.id !== excludeId).sort((a, b) => b.startedAt - a.startedAt);
  const find = (pred) => {
    for (const s of list) {
      if (!pred(s)) continue;
      const e = s.exercises.find((x) => x.exId === exId);
      const done = e ? e.sets.filter((x) => x.done) : [];
      if (done.length) return { session: s, sets: done };
    }
    return null;
  };
  return find((s) => s.dayKey === dayKey) || find(() => true);
}

function levelFromXP(xp) {
  let lv = Math.floor((1 + Math.sqrt(1 + (8 * xp) / LEVEL_BASE)) / 2);
  if (lv < 1) lv = 1;
  const at = (n) => (LEVEL_BASE * (n - 1) * n) / 2;
  const cur = at(lv), next = at(lv + 1);
  return { level: lv, into: xp - cur, need: next - cur, pct: (xp - cur) / (next - cur) };
}
function titleFor(lv) { let x = TITLES[0][1]; for (const [l, n] of TITLES) if (lv >= l) x = n; return L(x); }

/* XP werden immer aus den Daten berechnet: kein Drift bei Rückgängig, Import oder Löschen */
function computeProgress() {
  const sorted = S.sessions.slice().sort((a, b) => a.startedAt - b.startedAt);
  const best = {}, bestSet = {};
  let xp = 0, sets = 0, volume = 0, workouts = 0, prs = 0;
  for (const s of sorted) {
    const bw = s.bw || S.profile.bodyweight;
    if (s.finishedAt) { workouts++; xp += XP.finish; }
    for (const e of s.exercises) {
      if (!EX[e.exId]) continue;
      let sb = -1, sbSet = null;
      for (const x of e.sets) {
        if (!x.done) continue;
        sets++; xp += XP.set;
        if (x.beat) xp += XP.beat;
        volume += (num(x.kg) || 0) * (num(x.reps) || 0);
        const m = setMetric(e.exId, x, bw);
        if (m > sb) { sb = m; sbSet = x; }
      }
      if (!sbSet) continue;
      const prev = best[e.exId];
      if (prev !== undefined && sb > prev + 1e-6) { xp += XP.pr; prs++; }
      if (prev === undefined || sb > prev) {
        best[e.exId] = sb;
        bestSet[e.exId] = { kg: num(sbSet.kg) || 0, reps: num(sbSet.reps) || 0, metric: sb, date: s.date };
      }
    }
  }
  for (const h of Object.values(S.habits)) {
    const c = HABITS.filter((k) => habitDone(h, k)).length;
    xp += c * XP.habit + (c === HABITS.length ? XP.habitAll : 0);
  }
  return { xp, sets, volume, workouts, prs, best, bestSet, ...levelFromXP(xp) };
}

function streakInfo() {
  const days = S.sessions.filter((s) => s.finishedAt).map((s) => s.date).sort();
  if (!days.length) return { current: 0, best: 0, last: null };
  let run = 1, best = 1;
  for (let i = 1; i < days.length; i++) {
    run = diffDays(days[i - 1], days[i]) <= MAX_GAP_DAYS ? run + 1 : 1;
    best = Math.max(best, run);
  }
  const last = days[days.length - 1];
  return { current: diffDays(last, isoDate()) <= MAX_GAP_DAYS ? run : 0, best, last };
}

function mesoInfo(date = isoDate()) {
  let d = diffDays(S.settings.mesoStart, date);
  if (d < 0) d = 0;
  const week = (Math.floor(d / 7) % 5) + 1;
  const m = MESO[week];
  return { week, cycle: Math.floor(d / 35) + 1, c: m.c, i: m.i, label: L(m.label), info: L(m.info) };
}
function plannedSets(item, week) {
  if (week === 5) return Math.max(1, Math.ceil(item.sets / 2));
  if (item.bump && week === 3) return item.sets + 1;
  if (item.bump && week === 4) return item.sets + 2;
  return item.sets;
}
function weekRIR(item, week) { const m = MESO[week] || MESO[1]; return item.cat === 'c' ? m.c : m.i; }
function estimateMinutes(dayKey, week) {
  const sec = PLAN[dayKey].items.reduce((sum, it) => sum + plannedSets(it, week) * (45 + it.rest) * (EX[it.ex].perSide ? 1.5 : 1), 0);
  return Math.max(10, Math.round(sec / 60 / 5) * 5);
}
function sessionCounts(s) {
  let done = 0, total = 0;
  for (const e of s.exercises) for (const x of e.sets) { total++; if (x.done) done++; }
  return { done, total };
}
function lastDoneDate(dayKey) {
  const list = S.sessions.filter((s) => s.finishedAt && s.dayKey === dayKey).map((s) => s.date).sort();
  return list.length ? list[list.length - 1] : null;
}
function nextTraining() {
  const now = new Date();
  for (let i = 1; i <= 7; i++) {
    const d = new Date(now); d.setDate(now.getDate() + i);
    const key = S.settings.weekMap[d.getDay()];
    if (key !== 'REST') return { day: d.getDay(), key, inDays: i };
  }
  return null;
}
function weekDays() { const mon = mondayOf(isoDate()); return Array.from({ length: 7 }, (_, i) => addDays(mon, i)); }

/* Vorschlag für die Last eines Satzes, in kg */
function defaultKgFor(s, i, j) {
  const e = s.exercises[i];
  for (let k = j - 1; k >= 0; k--) { const v = num(e.sets[k].kg); if (Number.isFinite(v)) return v; }
  const ghost = ghostFor(e.exId, s.dayKey, s.id);
  const g = ghost && (ghost.sets[j] || ghost.sets[ghost.sets.length - 1]);
  if (g && Number.isFinite(num(g.kg))) return num(g.kg);
  return EX[e.exId] ? EX[e.exId].defaultKg : 0;
}
function progressionHint(item, ghost) {
  if (!ghost || !ghost.sets.length) return { text: t('hint_no_ghost'), top: false };
  const target = Math.min(item.sets, ghost.sets.length);
  const allTop = ghost.sets.length >= item.sets && ghost.sets.slice(0, target).every((x) => (num(x.reps) || 0) >= item.max);
  return allTop ? { text: t('hint_all_top'), top: true } : { text: t('hint_next'), top: false };
}

function bestMapBefore(startedAt, excludeId) {
  const map = {};
  for (const s of S.sessions) {
    if (!s.finishedAt || s.id === excludeId || s.startedAt >= startedAt) continue;
    const bw = s.bw || S.profile.bodyweight;
    for (const e of s.exercises) for (const x of e.sets) {
      if (!x.done) continue;
      const m = setMetric(e.exId, x, bw);
      if (!(e.exId in map) || m > map[e.exId]) map[e.exId] = m;
    }
  }
  return map;
}
function sessionSummary(s) {
  const prev = bestMapBefore(s.startedAt, s.id);
  const bw = s.bw || S.profile.bodyweight;
  let sets = 0, beatsN = 0, volume = 0;
  const prs = [];
  for (const e of s.exercises) {
    let best = null, bm = -1;
    for (const x of e.sets) {
      if (!x.done) continue;
      sets++; if (x.beat) beatsN++;
      volume += (num(x.kg) || 0) * (num(x.reps) || 0);
      const m = setMetric(e.exId, x, bw);
      if (m > bm) { bm = m; best = x; }
    }
    if (best && e.exId in prev && bm > prev[e.exId] + 1e-6) prs.push({ exId: e.exId, kg: num(best.kg) || 0, reps: num(best.reps) || 0 });
  }
  return {
    sets, beats: beatsN, volume, prs,
    xp: sets * XP.set + beatsN * XP.beat + prs.length * XP.pr + (s.finishedAt ? XP.finish : 0),
    durationMs: (s.finishedAt || Date.now()) - s.startedAt
  };
}
function exerciseHistory(exId) {
  return finishedSessions().map((s) => {
    const e = s.exercises.find((x) => x.exId === exId);
    const done = e ? e.sets.filter((x) => x.done) : [];
    if (!done.length) return null;
    const bw = s.bw || S.profile.bodyweight;
    let best = done[0], bm = -1;
    for (const x of done) { const m = setMetric(exId, x, bw); if (m > bm) { bm = m; best = x; } }
    return { date: s.date, metric: bm, kg: num(best.kg) || 0, reps: num(best.reps) || 0, sets: done.length };
  }).filter(Boolean);
}
function planUses(exId) {
  const out = [];
  for (const [k, p] of Object.entries(PLAN)) for (const it of p.items) if (it.ex === exId) out.push({ day: L(p.name), ...it });
  return out;
}
function bwStats() {
  const list = S.bodyweight.slice().sort((a, b) => a.date.localeCompare(b.date));
  const today = isoDate();
  const inRange = (from, to) => list.filter((e) => e.date > from && e.date <= to);
  const avg = (a) => (a.length ? a.reduce((sum, e) => sum + e.kg, 0) / a.length : NaN);
  const a1 = avg(inRange(addDays(today, -7), today));
  const a0 = avg(inRange(addDays(today, -14), addDays(today, -7)));
  return { list, avg7: a1, weekly: Number.isFinite(a1) && Number.isFinite(a0) ? a1 - a0 : NaN };
}

/* Scheiben-Rechner arbeitet in der Anzeige-Einheit mit dem passenden Scheiben-Set (kg oder lb) */
const plateSet = () => S.settings.plates[imperial() ? 'lb' : 'kg'];
function platePairs() {
  return plateSet().inv
    .filter((p) => p.w > 0 && p.count >= 2)
    .map((p) => ({ w: p.w, pairs: Math.floor(p.count / 2) }))
    .sort((a, b) => b.w - a.w);
}
function maxLoad() { return plateSet().bar + 2 * platePairs().reduce((s, p) => s + p.w * p.pairs, 0); }
function plateStepSize() { const p = platePairs(); return p.length ? 2 * p[p.length - 1].w : (imperial() ? 5 : 2.5); }
function solvePlates(target) {
  const bar = plateSet().bar;
  const types = platePairs();
  const perSideTarget = (Math.max(target, bar) - bar) / 2;
  let best = { sum: 0, count: 0, chosen: types.map(() => 0) };
  const chosen = [];
  const rec = (i, sum, count) => {
    if (sum > perSideTarget + 1e-6) return;
    if (i === types.length) {
      if (sum > best.sum + 1e-6 || (Math.abs(sum - best.sum) < 1e-6 && count < best.count)) best = { sum, count, chosen: chosen.slice() };
      return;
    }
    for (let n = types[i].pairs; n >= 0; n--) { chosen.push(n); rec(i + 1, sum + n * types[i].w, count + n); chosen.pop(); }
  };
  rec(0, 0, 0);
  const perSide = [];
  best.chosen.forEach((n, i) => { for (let k = 0; k < n; k++) perSide.push(types[i].w); });
  const total = bar + 2 * best.sum;
  return { total, perSide, exact: Math.abs(total - target) < 0.05 };
}
/* Aufwärmsätze in Anzeige-Einheit */
function warmupSets(workKg, mode) {
  const work = toDisp(workKg);
  return WARMUP_SCHEME.map((w) => {
    const raw = work * w.pct;
    if (mode === 'bar') {
      const sol = solvePlates(Math.max(plateSet().bar, raw));
      return { ...w, disp: sol.total, plates: sol.perSide };
    }
    const step = imperial() ? 1 : 0.5;
    return { ...w, disp: Math.round(raw / step) * step, plates: null };
  });
}

/* Tagesziele: alte Ja/Nein-Werte zählen als erreicht */
function habitVal(h, k) {
  const v = h ? h[k] : undefined;
  if (v === true) return HABIT_CFG[k].target || 1;
  const n = Number(v);
  return Number.isFinite(n) && v !== false && v !== null ? n : 0;
}
function habitDone(h, k) {
  const cfg = HABIT_CFG[k];
  if (cfg.kind === 'check') return !!(h && h[k]);
  return habitVal(h, k) >= cfg.target * 0.985;
}
const ML_PER_FLOZ = 29.5735;
function hUnit(k) { return k === 'water' ? (imperial() ? 'fl oz' : (LANG === 'en' ? 'L' : 'l')) : k === 'protein' ? 'g' : 'h'; }
function hToDisp(k, v) { return k === 'water' ? (imperial() ? v / ML_PER_FLOZ : v / 1000) : v; }
function hToCanon(k, d) { return k === 'water' ? (imperial() ? d * ML_PER_FLOZ : d * 1000) : d; }
function hStep(k) { return k === 'water' ? (imperial() ? 4 : 0.25) : HABIT_CFG[k].step; }
function hMaxDisp(k) { const st = hStep(k); return Math.floor(hToDisp(k, HABIT_CFG[k].max) / st + 1e-9) * st; }

function toast(msg, kind = 'info', ms = 2200) {
  const root = $('#toast-root'); if (!root) return;
  const dot = { ok: 'bg-green', xp: 'bg-accent', pr: 'bg-red', err: 'bg-red' }[kind] || '';
  const el = document.createElement('div');
  el.className = 'material toast-enter pointer-events-auto flex max-w-sm items-center gap-2 rounded-full px-4 py-2.5 t-sub font-semibold';
  el.style.boxShadow = 'var(--shadow)';
  el.setAttribute('role', 'status');
  el.innerHTML = `${dot ? `<span class="h-2 w-2 shrink-0 rounded-full ${dot}"></span>` : ''}<span>${esc(msg)}</span>`;
  root.appendChild(el);
  while (root.children.length > 2) root.firstChild.remove();
  setTimeout(() => {
    el.style.transition = 'opacity .3s, transform .3s';
    el.style.opacity = '0'; el.style.transform = 'translateY(-8px)';
    setTimeout(() => el.remove(), 320);
  }, ms);
}

/* Diagramm im MacroFactor-Stil: Trendlinie plus Einzelwerte als Punkte */
function chartSVG(line, dots = [], { labels = true, fmt = (v) => fmtNum(Math.round(v * 10) / 10, 1) } = {}) {
  const all = line.concat(dots).filter(Number.isFinite);
  const n = Math.max(line.length, dots.length);
  if (n < 2 || all.length < 2) return '';
  const W = 320, H = 118, padR = labels ? 44 : 4, padT = 8, padB = 8;
  let min = Math.min(...all), max = Math.max(...all);
  if (max - min < 1e-9) { min -= 1; max += 1; }
  const pad = (max - min) * 0.15; min -= pad; max += pad;
  const x = (i) => (i / (n - 1)) * (W - padR - 8) + 4;
  const y = (v) => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);
  const grid = [0, 0.5, 1].map((f) => {
    const yy = (padT + f * (H - padT - padB)).toFixed(1);
    const label = labels ? `<text x="${W - padR + 8}" y="${(+yy + 4).toFixed(1)}" style="fill: rgb(var(--label2) / var(--label2-a)); font-size: 11px">${esc(fmt(max - f * (max - min)))}</text>` : '';
    return `<line x1="0" x2="${W - padR}" y1="${yy}" y2="${yy}" style="stroke: rgb(var(--sep) / var(--sep-a))" stroke-width="1" ${f < 1 ? 'stroke-dasharray="2 4"' : ''}/>${label}`;
  }).join('');
  const dotSvg = dots.map((v, i) => (Number.isFinite(v) ? `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" style="fill: rgb(var(--label2) / .38)"/>` : '')).join('');
  const pts = line.map((v, i) => (Number.isFinite(v) ? [x(i), y(v)] : null)).filter(Boolean);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const last = pts[pts.length - 1];
  return `
    <svg viewBox="0 0 ${W} ${H}" class="mt-3 block h-auto w-full" aria-hidden="true">
      ${grid}${dotSvg}
      ${pts.length > 1 ? `<path d="${d}" fill="none" style="stroke: rgb(var(--accent-ink))" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
      ${last ? `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" style="fill: rgb(var(--accent-ink)); stroke: rgb(var(--card))" stroke-width="2"/>` : ''}
    </svg>`;
}

/* Langhantel in Seitenansicht; Scheibenhöhe nach Gewicht in der Anzeige-Einheit */
function plateSize(w) {
  const kg = imperial() ? w / LB_PER_KG : w;
  const h = kg >= 20 ? 80 : kg >= 15 ? 70 : kg >= 10 ? 60 : kg >= 5 ? 44 : kg >= 2.5 ? 32 : kg >= 1.25 ? 26 : 20;
  const wd = kg >= 20 ? 11 : kg >= 15 ? 10 : kg >= 10 ? 9 : kg >= 5 ? 8 : kg >= 2.5 ? 6 : 5;
  return [h, wd];
}
function barbellSVG(perSide) {
  const W = 320, H = 92, cy = 46, collarL = 118, collarR = 202;
  const need = perSide.reduce((s, k) => s + plateSize(k)[1] + 2, 0);
  const f = need > collarL - 10 ? (collarL - 10) / need : 1;
  let xL = collarL - 3, xR = collarR + 3, plates = '';
  for (const k of perSide) {
    const [h, w0] = plateSize(k), w = w0 * f, gap = 2 * f;
    xL -= w + gap;
    plates += `<rect x="${xL.toFixed(1)}" y="${cy - h / 2}" width="${w.toFixed(1)}" height="${h}" rx="2" style="fill: rgb(var(--accent))"/>`;
    plates += `<rect x="${(xR + gap).toFixed(1)}" y="${cy - h / 2}" width="${w.toFixed(1)}" height="${h}" rx="2" style="fill: rgb(var(--accent))"/>`;
    xR += w + gap;
  }
  return `
    <svg viewBox="0 0 ${W} ${H}" class="block h-auto w-full" role="img" aria-label="${esc(perSide.map(fmtDispV).join(', '))}">
      <rect x="6" y="${cy - 3}" width="${W - 12}" height="6" rx="3" style="fill: rgb(var(--label2) / .35)"/>
      <rect x="${collarL}" y="${cy - 2}" width="${collarR - collarL}" height="4" style="fill: rgb(var(--label2) / .55)"/>
      <rect x="${collarL - 3}" y="${cy - 8}" width="3" height="16" rx="1" style="fill: rgb(var(--label2) / .7)"/>
      <rect x="${collarR}" y="${cy - 8}" width="3" height="16" rx="1" style="fill: rgb(var(--label2) / .7)"/>
      ${plates}
    </svg>`;
}

      ${days.map((d) => {

const SET_GRID = 'grid grid-cols-[1.75rem_minmax(0,1fr)_4rem_4rem_2.75rem] items-center gap-2';

function setRow(s, i, j, ghost, isNext) {
  const e = s.exercises[i], x = e.sets[j], ex = EX[e.exId];
  const g = ghost ? ghost.sets[j] : null;
  const phKg = fmtWv(defaultKgFor(s, i, j));
  const phReps = g ? String(g.reps) : `${e.plan.min}–${e.plan.max}`;
  const done = x.done;
  const ghostTxt = g ? setTxt(ex, num(g.kg) || 0, g.reps) : '–';
  const kgVal = x.kg === '' ? '' : fmtWv(num(x.kg));
  return `
    <div class="${SET_GRID} -mx-2 rounded-[12px] px-2 py-1 ${done ? 'bg-green/10' : isNext ? 'bg-accent/10' : ''}">
      <span class="text-center t-sub font-semibold tnum ${done ? 'text-green' : isNext ? 'text-ink' : 'text-label2'}">${j + 1}</span>
      <button data-action="copyGhost" data-ex="${i}" data-set="${j}" class="tap min-w-0 truncate text-left t-sub tnum ${x.beat ? 'font-semibold text-green' : 'text-label2'}"
        ${g && !done ? `aria-label="${esc(t('ghost_take', { v: ghostTxt }))}"` : 'tabindex="-1" aria-hidden="true"'}>${esc(ghostTxt)}${x.beat ? ' ↑' : ''}</button>
      <input data-input="set" data-ex="${i}" data-set="${j}" data-field="kg" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off"
        aria-label="${esc(t('set_n', { n: j + 1 }))}: ${esc(loadHelp(ex))}" value="${esc(kgVal)}" placeholder="${esc(phKg)}" class="cell">
      <input data-input="set" data-ex="${i}" data-set="${j}" data-field="reps" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="off"
        aria-label="${esc(t('set_n', { n: j + 1 }))}: ${esc(t('reps'))}" value="${esc(x.reps)}" placeholder="${esc(phReps)}" class="cell">
      <button data-action="toggleSet" data-ex="${i}" data-set="${j}" aria-pressed="${done}" aria-label="${esc(t(done ? 'reopen_set' : 'check_set', { n: j + 1 }))}"
        class="chk tap ${lastPop === `${i}:${j}` ? 'pop' : ''}">${icon('check', 'h-5 w-5', false, 2.6)}</button>
    </div>`;
}

function exerciseCard(s, i) {
  const e = s.exercises[i], ex = EX[e.exId], it = e.plan;
  if (!ex) return '';
  const ghost = ghostFor(e.exId, s.dayKey, s.id);
  const nextIdx = e.sets.findIndex((x) => !x.done);
  const complete = e.sets.length > 0 && nextIdx === -1;
  const bumpN = it.bump && s.week === 3 ? 1 : it.bump && s.week === 4 ? 2 : 0;
  const hint = progressionHint(it, ghost);
  const isBar = ex.load === 'bar' || ex.load === 'barvest';
  const noteSrc = planItemFor(s.dayKey, e.exId) || it;
  const note = noteSrc.note ? L(noteSrc.note) : '';
  return `
    <section id="ex-${i}" class="card overflow-hidden">
      <div class="flex items-start gap-3 px-4 pt-4">
        <div class="min-w-0 flex-1">
          <p class="t-foot tnum ${complete ? 'font-semibold text-green' : 'text-label2'}">${esc(complete ? t('done') : t('exercise_x_of_y', { a: i + 1, b: s.exercises.length }))}</p>
          <h3 class="t-headline">${esc(exName(e.exId))}</h3>
        </div>
        <button data-action="openExercise" data-ex="${e.exId}" class="tap -mr-1.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-ink" aria-label="${esc(t('guide'))}">${icon('info', 'h-[22px] w-[22px]', false, 1.8)}</button>
      </div>
      <dl class="mt-3 grid grid-cols-4 gap-2 px-4">
        ${spec(t('sets'), `${e.sets.length}×${it.min}–${it.max}`)}
        ${spec('RIR', weekRIR(it, s.week))}
        ${spec('Tempo', it.tempo)}
        ${spec(t('rest'), fmtDur(it.rest))}
      </dl>
      ${bumpN ? `<p class="mt-2 px-4 t-foot font-semibold text-orange">${esc(t('bump', { n: bumpN }))}</p>` : ''}
      ${note ? `<p class="mt-2 px-4 t-foot text-label2">${esc(wt(note))}</p>` : ''}
      <div class="mt-3 px-4">
        <div class="${SET_GRID} pb-1.5 t-cap font-semibold text-label2">
          <span class="text-center">${esc(t('set'))}</span><span>Ghost</span><span class="text-center">${esc(loadLabel(ex))}</span><span class="text-center">${esc(ex.perSide ? t('reps_side') : t('reps'))}</span><span></span>
        </div>
        <div class="space-y-1">${e.sets.map((x, j) => setRow(s, i, j, ghost, j === nextIdx)).join('')}</div>
      </div>
      <div class="px-4 pt-3">
        ${complete
          ? `<div class="btn btn-done">${icon('check', 'h-5 w-5', false, 2.6)}${esc(t('exercise_done'))}</div>`
          : `<button data-action="completeNext" data-ex="${i}" class="btn btn-primary tap">${esc(t('complete_set', { n: nextIdx + 1 }))}</button>`}
      </div>
      <p class="mt-3 px-4 t-foot ${hint.top ? 'font-semibold text-ink' : 'text-label2'}">${esc(hint.text)}</p>
      <div class="flex items-center gap-5 px-4 pb-4 pt-2.5 t-sub">
        <button data-action="addSet" data-ex="${i}" class="tap flex items-center gap-1 font-semibold text-ink">${icon('plus', 'h-4 w-4', false, 2.4)} ${esc(t('set'))}</button>
        <button data-action="removeSet" data-ex="${i}" class="tap flex items-center gap-1 text-label2" aria-label="${esc(t('remove_last_set'))}">${icon('minus', 'h-4 w-4', false, 2.4)} ${esc(t('set'))}</button>
        <span class="flex-1"></span>
        ${ex.warmup ? `<button data-action="openWarmup" data-ex="${i}" class="tap text-ink">${esc(t('warmup'))}</button>` : ''}
        ${isBar ? `<button data-action="openPlates" data-ex="${i}" class="tap text-ink">${esc(t('plates'))}</button>` : ''}
      </div>
    </section>`;
}
function rerenderCard(i) {
  const s = activeSession(); const el = $(`#ex-${i}`);
  if (s && el) el.outerHTML = exerciseCard(s, i);
}
function updateWorkoutProgress() {

function libraryListHTML() {
  const q = libQuery.trim().toLowerCase();
  const group = MUSCLE_GROUPS.find((g) => g.key === libFilter);
  const items = Object.keys(EX).filter((id) => {
    const ex = EX[id];
    if (group && group.muscles && !ex.primary.some((m) => group.muscles.includes(m))) return false;
    if (q && !(exName(id).toLowerCase().includes(q) || ex.primary.concat(ex.secondary).some((m) => mName(m).toLowerCase().includes(q)))) return false;
    return true;
  }).sort((a, b) => exName(a).localeCompare(exName(b), LOCALE()));
  if (!items.length) return `<div class="p-6 text-center t-sub text-label2">${esc(t('no_exercise'))}</div>`;
  return items.map((id) => `
    <button data-action="openExercise" data-ex="${id}" class="row tap">
      <span class="min-w-0 flex-1">
        <span class="block t-body">${esc(exName(id))}</span>
        <span class="block truncate t-foot text-label2">${esc(EX[id].primary.map(mName).join(', '))}</span>
      </span>
      <span class="text-label3">${icon('chevron', 'h-4 w-4', false, 2.4)}</span>
    </button>`).join('');
}

function openExerciseSheet(exId, backDay) {
  const ex = EX[exId], tx = exT(exId); if (!ex) return;
  const uses = planUses(exId), hist = exerciseHistory(exId);
  const best = hist.reduce((b, h) => (!b || h.metric > b.metric ? h : b), null);
  const last = hist.length ? hist[hist.length - 1] : null;
  const showE1 = !(ex.bw > 0) && best && best.kg > 0;
  const histHTML = hist.length ? `
    <section class="card overflow-hidden">
      <div class="vdiv grid grid-cols-2">
        <div class="min-w-0 px-4 py-3.5">
          <div class="t-cap text-label2">${esc(t('best_set'))}</div>
          <div class="t-title3 t-num">${esc(setTxtU(ex, best.kg, best.reps))}</div>
          <div class="t-cap tnum text-label2">${fmtDate(best.date)}${showE1 ? `, 1RM ≈ ${esc(fmtW(Math.round(best.metric * 10) / 10))}` : ''}</div>
        </div>
        <div class="min-w-0 px-4 py-3.5">
          <div class="t-cap text-label2">${esc(t('last'))}</div>
          <div class="t-title3 t-num">${esc(setTxtU(ex, last.kg, last.reps))}</div>
          <div class="t-cap tnum text-label2">${fmtDate(last.date)}, ${esc(t('n_sets', { n: last.sets }))}</div>
        </div>
      </div>
      ${hist.length >= 2 ? `<div class="hair-t px-4 pb-4">${chartSVG(hist.slice(-12).map((x) => x.metric), [], { labels: false })}<p class="mt-1 t-cap text-label2">${esc(t('hist_caption', { n: Math.min(12, hist.length) }))}</p></div>` : ''}
    </section>`
    : `<section class="card p-4 t-sub text-label2">${esc(t('hist_empty'))}</section>`;

  Modal.open(`
    ${backDay && PLAN[backDay] ? `<button data-action="previewWorkout" data-day="${backDay}" class="tap -mt-1 mb-2 flex items-center gap-0.5 px-1 t-body text-ink">${icon('chevron', 'h-4 w-4 rotate-180', false, 2.4)}${esc(L(PLAN[backDay].name))}</button>` : ''}
    ${sheetHeader(tx.name, tx.equip.map(wt).join(', '))}
    <section class="card mt-4 px-4 pb-4 pt-5">${anatomySVG(ex.primary, ex.secondary)}</section>
    <section class="card list mt-3">
      <div class="row !items-start"><span class="w-28 shrink-0 t-body text-label2">${esc(t('target_muscle'))}</span><span class="t-body">${esc(ex.primary.map(mName).join(', '))}</span></div>
      ${ex.secondary.length ? `<div class="row !items-start"><span class="w-28 shrink-0 t-body text-label2">${esc(t('assisting'))}</span><span class="t-body">${esc(ex.secondary.map(mName).join(', '))}</span></div>` : ''}
    </section>

    ${secHead(t('how_to'))}
    <ol class="card list" style="--inset:44px">
      ${tx.steps.map((st, i) => `<li class="row !items-start"><span class="w-4 shrink-0 t-body font-semibold tnum text-ink">${i + 1}</span><span class="t-body">${esc(wt(st))}</span></li>`).join('')}
    </ol>

    ${secHead(t('max_growth'))}
    <ul class="card list">${tx.tips.map((x) => `<li class="row"><span class="t-body">${esc(wt(x))}</span></li>`).join('')}</ul>

    ${secHead(t('with_equipment'))}
    <section class="card p-4 t-body">${esc(wt(tx.note))}</section>

    ${uses.length ? `
      ${secHead(t('in_plan'))}
      <section class="card list">
        ${uses.map((u) => `
          <div class="row">
            <span class="min-w-0 flex-1 t-body">${esc(u.day)}</span>
            <span class="shrink-0 t-sub tnum text-label2">${u.sets} × ${u.min}–${u.max}${ex.perSide ? esc(t('per_side_short')) : ''}, ${esc(u.tempo)}, ${fmtDur(u.rest)}</span>
          </div>`).join('')}
      </section>` : ''}

    ${secHead(t('your_history'))}
    ${histHTML}`, { label: tx.name });
}

function canShareFiles() {

    return navigator.canShare({ files: [new File(['{}'], 'backup.json', { type: 'application/json' })] });
  } catch (e) { return false; }
}

function habitRowHTML(k, h) {
  const cfg = HABIT_CFG[k];
  if (cfg.kind === 'check') {
    const on = habitDone(h, k);
    return `
      <button data-action="habitCheck" data-key="${k}" aria-pressed="${on}" class="row tap">
        <span class="flex h-[22px] w-[22px] shrink-0 items-center justify-center rounded-full ${on ? 'bg-green text-white' : 'border-[1.5px] border-label3 text-transparent'}">${icon('check', 'h-3.5 w-3.5', false, 3)}</span>
        <span class="min-w-0 flex-1"><span class="block t-body">${esc(t(`habit_${k}`))}</span><span class="block t-foot text-label2">${esc(t(`habit_${k}_hint`))}</span></span>
      </button>`;
  }
  const v = habitVal(h, k), done = habitDone(h, k);
  const max = hMaxDisp(k), st = hStep(k);
  const d = clamp(Math.round(hToDisp(k, v) / st) * st, 0, max);
  const tgt = hToDisp(k, cfg.target);
  return `
    <div class="px-4 pb-3 pt-3.5" data-habit-row="${k}">
      <div class="flex items-baseline justify-between gap-3">
        <span class="t-body">${esc(t(`habit_${k}`))}</span>
        <span class="t-sub tnum"><span data-hv class="font-semibold ${done ? 'text-green' : ''}">${hFmt(k, hToDisp(k, v))}</span><span class="text-label2"> / ${hFmt(k, tgt)} ${esc(hUnit(k))}</span></span>
      </div>
      <div class="mt-1.5 flex items-center gap-3">
        <button data-action="habitStep" data-key="${k}" data-dir="-1" class="stepper stepper-sm tap" aria-label="${esc(t('less'))}">${icon('minus', 'h-4 w-4', false, 2.4)}</button>
        <div class="relative min-w-0 flex-1">
          <span class="pointer-events-none absolute top-1/2 h-3.5 w-[2px] -translate-y-1/2 rounded-full bg-label3" style="left: calc(13px + (100% - 26px) * ${(tgt / max).toFixed(4)} - 1px)" aria-hidden="true"></span>
          <input data-input="habitRange" data-key="${k}" type="range" min="0" max="${max}" step="${st}" value="${d}"
            aria-label="${esc(t(`habit_${k}`))} (${esc(hUnit(k))})" class="hrange relative ${done ? 'done' : ''}" style="--f:${(d / max).toFixed(4)}">
        </div>
        <button data-action="habitStep" data-key="${k}" data-dir="1" class="stepper stepper-sm tap" aria-label="${esc(t('more'))}">${icon('plus', 'h-4 w-4', false, 2.4)}</button>
      </div>
      <p data-hr class="mt-1 t-foot tnum ${done ? 'font-semibold text-green' : 'text-label2'}">${esc(habitRemainText(k, v))}</p>
    </div>`;
}
function habitRemainText(k, v) {
  const cfg = HABIT_CFG[k];
  if (v >= cfg.target * 0.985) return t('goal_reached');
  return t('left_to_go', { v: `${hFmt(k, hToDisp(k, cfg.target - v))} ${hUnit(k)}` });
}
function updateHabitRow(k) {
  const row = $(`[data-habit-row="${k}"]`); if (!row) return;
  const h = S.habits[isoDate()] || {}, v = habitVal(h, k), done = habitDone(h, k);
  const inp = row.querySelector('input'), hv = row.querySelector('[data-hv]'), hr = row.querySelector('[data-hr]');
  inp.style.setProperty('--f', (Number(inp.value) / hMaxDisp(k)).toFixed(4));
  inp.classList.toggle('done', done);
  hv.textContent = hFmt(k, hToDisp(k, v));
  hv.classList.toggle('text-green', done);
  hr.textContent = habitRemainText(k, v);
  hr.classList.toggle('text-green', done); hr.classList.toggle('font-semibold', done); hr.classList.toggle('text-label2', !done);
}

/* Vorschau vor dem Start: Ablauf, Lasten, Equipment */
function lastLoadText(exId, dayKey) {
  const ex = EX[exId], ghost = ghostFor(exId, dayKey, '');
  if (ghost) {
    const bw = ghost.session.bw || S.profile.bodyweight;
    let best = ghost.sets[0], bm = -1;
    for (const x of ghost.sets) { const m = setMetric(exId, x, bw); if (m > bm) { bm = m; best = x; } }
    return t('last_load', { v: setTxtU(ex, num(best.kg) || 0, best.reps), d: fmtDate(ghost.session.date) });
  }
  return ex.defaultKg > 0 ? t('start_load', { v: `${isAdded(ex) ? '+' : ''}${fmtW(ex.defaultKg)}` }) : '';
}

  const note = week === 5 ? t('note_deload') : week === 3 ? t('note_overload') : week === 4 ? t('note_peak') : '';
  Modal.open(`
    ${sheetHeader(L(p.name), L(p.focus))}

      ${stat(p.items.length, t('exercises'))}${stat(totalSets, t('sets'))}${stat(`≈${estimateMinutes(dayKey, week)}`, t('minutes'))}

/* ---------- 8 · Timer ---------- */
let audioCtx = null, wakeLock = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* kein Audio verfügbar */ }
}
function beep() {
  if (!S.settings.sound) return;
  try {
    unlockAudio(); if (!audioCtx) return;
    const t0 = audioCtx.currentTime + 0.02;
    [[0, 880], [0.22, 1175], [0.44, 1568]].forEach(([d, f]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + d + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.35);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + d); o.stop(t0 + d + 0.38);
    });
  } catch (e) { /* ignorieren */ }
}

const Timer = {
  iv: null, endHide: null,
  get running() { return !!(S.timer && S.timer.endAt); },
  start(sec, label) {
    sec = Math.round(num(sec));
    if (!(sec > 0)) return;
    unlockAudio();
    S.timer = { endAt: Date.now() + sec * 1000, duration: sec, label: label || t('rest_label') };
    save(); this.ensureLoop(); this.render();
  },
  add(sec) {
    if (!this.running) return;
    S.timer.endAt += sec * 1000;
    S.timer.duration = Math.max(1, S.timer.duration + sec);
    if (S.timer.endAt <= Date.now()) { this.finish(); return; }
    save(); this.render();
  },
  stop() {
    S.timer = null; save();
    clearInterval(this.iv); this.iv = null;
    clearTimeout(this.endHide);
    this.render();
  },
  ensureLoop() { if (!this.iv) this.iv = setInterval(() => this.tick(), 250); },
  tick() {
    if (!this.running) return;
    const rem = S.timer.endAt - Date.now();
    if (rem <= 0) this.finish(); else this.paint(rem);
  },
  finish() {
    S.timer = null; save();
    clearInterval(this.iv); this.iv = null;
    beep(); vibrate([250, 120, 250, 120, 400]); flash('green');
    this.render(true);
  },
  render(ended = false) {
    const bar = $('#timerbar');
    if (!this.running && !ended) {
      bar.classList.add('hidden'); bar.innerHTML = '';
      document.body.classList.remove('timer-on');
      return;
    }
    document.body.classList.add('timer-on');
    bar.classList.remove('hidden');
    if (ended) {
      bar.innerHTML = `
        <div class="mx-auto max-w-md px-3">
          <div class="material toast-enter flex items-center gap-3 rounded-[22px] px-4 py-3" style="box-shadow: var(--shadow)">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-green text-white">${icon('check', 'h-5 w-5', false, 2.8)}</span>
            <div class="min-w-0 flex-1"><div class="t-headline">${esc(t('rest_over'))}</div><div class="t-foot text-label2">${esc(t('next_set'))}</div></div>
            <button data-action="timerStop" class="tap px-2 t-body font-semibold text-ink">OK</button>
          </div>
        </div>`;
      clearTimeout(this.endHide);
      this.endHide = setTimeout(() => { if (!this.running) this.render(); }, 4500);
      return;
    }
    const rem = S.timer.endAt - Date.now();
    bar.innerHTML = `
      <div class="mx-auto max-w-md px-3">
        <div class="material overflow-hidden rounded-[22px]" style="box-shadow: var(--shadow)">
          <div class="flex items-center gap-2 py-2.5 pl-4 pr-2.5">
            <div class="min-w-0 flex-1">
              <div class="truncate t-foot text-label2">${esc(S.timer.label)}</div>
              <div id="tDigits" class="t-num text-[34px] leading-[40px]">${fmtDur(Math.ceil(rem / 1000))}</div>
            </div>
            <button data-action="timerAdd" data-sec="-15" class="tbtn tap" aria-label="−15 s">−15</button>
            <button data-action="timerAdd" data-sec="15" class="tbtn tap" aria-label="+15 s">+15</button>
            <button data-action="timerStop" class="tbtn tap !min-w-[40px] !px-0" aria-label="${esc(t('stop_timer'))}">${icon('x', 'h-4 w-4', false, 2.6)}</button>
          </div>
          <div class="well h-[3px]"><div id="tBar" class="h-full bg-accent" style="width:${clamp((rem / (S.timer.duration * 1000)) * 100, 0, 100).toFixed(1)}%"></div></div>
        </div>
      </div>`;
    this.paint(rem);
  },
  paint(rem) {
    const d = $('#tDigits'), b = $('#tBar');
    if (!d) { this.render(); return; }
    const sec = Math.ceil(rem / 1000), warn = sec <= 5;
    d.textContent = fmtDur(sec);
    d.classList.toggle('text-red', warn);
    if (b) {
      b.style.width = `${clamp((rem / (S.timer.duration * 1000)) * 100, 0, 100).toFixed(1)}%`;
      b.classList.toggle('bg-red', warn); b.classList.toggle('bg-accent', !warn);
    }
  }
};

async function requestWakeLock() {
  if (!S.settings.wakeLock || !activeSession() || wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
  try {

    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}

function setTab(tab, opts = {}) {
  if (!TABS.includes(tab)) tab = 'home';
  if (!opts.fromPop) {
    if (currentTab === 'home' && tab !== 'home') history.pushState({ apexTab: tab }, '');
    else if (currentTab !== 'home' && tab === 'home') {
      if (history.state && history.state.apexTab) { ignoreNextPop = true; history.back(); }
    } else if (tab !== 'home') history.replaceState({ apexTab: tab }, '');
  }
  const changed = tab !== currentTab;
  currentTab = tab;
  render();
  if (changed) window.scrollTo(0, 0);
}

function render() {
  const y = window.scrollY;
  $('#view').innerHTML = currentTab === 'home' ? viewHome()
    : currentTab === 'workout' ? viewWorkout()
      : currentTab === 'tools' ? viewTools()
        : currentTab === 'library' ? viewLibrary()
          : viewProfile();
  renderNav();
  tickElapsed();
  Timer.render();
  window.scrollTo(0, y);
}

function syncLevel(celebrate) {
  const p = computeProgress();
  const last = S.meta.lastLevel || 1;
  if (p.level === last) return p;
  S.meta.lastLevel = p.level; save();
  if (celebrate && p.level > last) {
    flash('level'); vibrate([80, 60, 80]);
    toast(t('level_up', { l: p.level, title: titleFor(p.level) }), 'xp', 3200);

function startWorkout(dayKey) {
  if (!PLAN[dayKey]) return;
  if (modalOpen) Modal.close();
  const act = activeSession();
  if (act) {
    if (act.dayKey !== dayKey) toast(t('workout_running', { name: planName(act.dayKey) }), 'err', 2600);
    setTab('workout');
    return;
  }
  const week = mesoInfo().week;
  const s = {
    id: uid('s'), dayKey, date: isoDate(), week, startedAt: Date.now(), finishedAt: null, bw: currentBW(),
    exercises: PLAN[dayKey].items.map((it) => ({ exId: it.ex, plan: { ...it }, sets: Array.from({ length: plannedSets(it, week) }, newSet) }))
  };
  S.sessions.push(s);
  S.activeId = s.id;
  save(true);
  requestWakeLock();
  setTab('workout');
}

function toggleSet(i, j) {
  const s = activeSession(); if (!s) return;
  const e = s.exercises[i], x = e && e.sets[j];
  if (!x) return;
  if (x.done) {
    x.done = false; x.beat = false; x.ts = null;
    save(); rerenderCard(i); updateWorkoutProgress(); syncLevel(false);
    return;
  }
  let kg = num(x.kg);
  if (!Number.isFinite(kg)) kg = defaultKgFor(s, i, j);
  const reps = Math.round(num(x.reps));
  if (!(reps > 0)) {
    toast(t('toast_enter_reps'), 'err');
    const inp = $(`[data-input="set"][data-ex="${i}"][data-set="${j}"][data-field="reps"]`);
    if (inp) inp.focus();
    return;
  }
  if (kg < 0 || kg > 500) { toast(t('toast_weight_implausible'), 'err'); return; }
  const before = computeProgress();
  x.kg = kgStr(kg); x.reps = String(reps); x.done = true; x.ts = Date.now();
  const ghost = ghostFor(e.exId, s.dayKey, s.id);
  const g = ghost ? ghost.sets[j] : null;
  x.beat = !!g && beats(kg, reps, num(g.kg) || 0, num(g.reps) || 0);
  save();
  const after = computeProgress();
  lastPop = `${i}:${j}`; rerenderCard(i); lastPop = null;
  updateWorkoutProgress();
  const gain = after.xp - before.xp;
  if (after.prs > before.prs) { toast(t('toast_new_record', { n: gain }), 'pr', 2800); vibrate([60, 40, 60]); }
  else if (x.beat) toast(t('toast_ghost_beaten', { n: gain }), 'xp');
  else toast(t('xp_gain', { n: gain }), 'xp', 1300);
  if (S.settings.autoTimer) Timer.start(e.plan.rest || S.settings.restDefault, t('rest_after', { name: exName(e.exId) }));
  syncLevel(true);
}

function habitCommit(before) {
  save();
  const diff = computeProgress().xp - before;
  if (diff > 0) toast(t('xp_gain', { n: diff }), 'xp', 1300);
  render();
  syncLevel(true);
}
function habitDay() { const d = isoDate(); return S.habits[d] || (S.habits[d] = {}); }
function toggleHabit(key) {
  const before = computeProgress().xp, h = habitDay();
  h[key] = !h[key];
  habitCommit(before);
}
function stepHabit(key, dir) {
  const before = computeProgress().xp, h = habitDay();
  const st = hStep(key), max = hMaxDisp(key);
  const cur = Math.round(hToDisp(key, habitVal(h, key)) / st) * st;
  const next = clamp(cur + dir * st, 0, max);
  h[key] = Math.round(hToCanon(key, next) * 100) / 100;
  habitCommit(before);
}

function saveBodyweight() {
  const kg = toKg(num(bwDraft));
  if (!(kg >= 30 && kg <= 250)) { toast(t('toast_bw_range', { a: fmtW(30), b: fmtW(250) }), 'err'); return; }
  const d = isoDate(), r = Math.round(kg * 100) / 100;
  const existing = S.bodyweight.find((e) => e.date === d);
  if (existing) existing.kg = r; else S.bodyweight.push({ date: d, kg: r });
  S.profile.bodyweight = r;
  bwDraft = '';
  save(); render();
  toast(t('toast_bw_logged', { w: fmtW(r) }), 'ok');
}

function saveProfile() {
  let cm;
  if (imperial()) {
    const ft = num(($('#pfFt') || {}).value), inch = num(($('#pfIn') || {}).value) || 0;
    cm = Number.isFinite(ft) ? (ft * 12 + inch) * CM_PER_IN : NaN;
  } else cm = num(($('#pfCm') || {}).value);
  const age = Math.round(num(($('#pfAge') || {}).value));
  if (!(cm >= 120 && cm <= 230) || !(age >= 12 && age <= 100)) { toast(t('toast_profile_invalid'), 'err', 2800); return; }
  S.profile.height = Math.round(cm * 10) / 10;
  S.profile.age = age;
  save(); Modal.close(); render();
  toast(t('toast_profile_saved'), 'ok');
}

/* Backup: selbst gehostet per Download-Link, in der Vorschau über die Download-Freigabe des Viewers */
let downloadsNS = null;
function canExport() { return !PREVIEW || !!downloadsNS; }
function initDownloads() {
  if (!PREVIEW) return;
  window.claude.use('downloads').then((ns) => {
    downloadsNS = ns;
    if (ns && !modalOpen && (currentTab === 'profile' || currentTab === 'home')) render();
  }).catch(() => { downloadsNS = null; });
}
function backupPayload() {
  return JSON.stringify({ app: 'apex', version: APP_VERSION, exportedAt: new Date().toISOString(), data: S }, null, 2);
}
function backupName() { return `apex-backup-${isoDate()}.json`; }
function markBackup() { S.lastBackup = Date.now(); save(); render(); toast(t('toast_backup_saved'), 'ok'); }
async function exportData() {
  if (PREVIEW) {
    if (!downloadsNS) { toast(t('toast_save_unavailable'), 'err'); return; }
    try {
      const res = await downloadsNS.save({ filename: backupName(), data: backupPayload() });
      if (res && res.status === 'saved') markBackup();
    } catch (err) {
      const code = err && err.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') { toast(t('toast_save_dialog_open'), 'err'); return; }
      downloadsNS = null; render();
      toast(t('toast_save_unavailable'), 'err');
    }
    return;
  }
  const blob = new Blob([backupPayload()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = backupName(); a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  markBackup();
}
async function shareData() {
  const file = new File([backupPayload()], backupName(), { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: `${APP_NAME} Backup` });
      S.lastBackup = Date.now(); save(); render();
      toast(t('toast_backup_shared'), 'ok');
    } else exportData();
  } catch (err) {
    if (err && err.name !== 'AbortError') toast(t('toast_share_failed'), 'err', 3000);
  }
}
async function importFile(file) {
  let parsed;
  try { parsed = JSON.parse(await file.text()); }
  catch (e) { toast(t('toast_import_invalid'), 'err', 3000); return; }
  const data = parsed && ['apex', 'hypertrophy-pro'].includes(parsed.app) && parsed.data ? parsed.data : parsed;
  if (!data || !Array.isArray(data.sessions) || typeof data.settings !== 'object') {
    toast(t('toast_import_not_apex'), 'err', 3000); return;
  }
  const n = data.sessions.filter((s) => s && s.finishedAt).length;
  const when = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleDateString(LOCALE()) : '';
  const current = S.sessions.filter((s) => s.finishedAt).length;
  confirmSheet({
    title: t('confirm_import_title'),
    text: t('confirm_import_text', { when, n, cur: current }),
    confirmLabel: t('import'),
    onConfirm: () => {
      try { localStorage.setItem(`${STORE_KEY}:vor-import`, JSON.stringify(S)); } catch (e) { /* Platz reicht evtl. nicht */ }
      S = migrate(data);
      save(true);
      applySettings();
      if (Timer.running) Timer.ensureLoop();
      syncLevel(false);
      render();
      toast(t('toast_imported'), 'ok');
    }
  });
}

const ACTIONS = {
  tab: (el) => setTab(el.dataset.tab),
  startWorkout: (el) => startWorkout(el.dataset.day),
  finishWorkout: () => finishWorkout(),
  discardWorkout: () => confirmSheet({
    title: t('confirm_discard_title'), text: t('confirm_discard_text'),
    confirmLabel: t('discard'), danger: true, onConfirm: discardActive
  }),
  toggleSet: (el) => toggleSet(+el.dataset.ex, +el.dataset.set),
  completeNext: (el) => {
    const s = activeSession(); if (!s) return;
    const i = +el.dataset.ex, j = s.exercises[i].sets.findIndex((x) => !x.done);
    if (j >= 0) toggleSet(i, j);
  },
  copyGhost: (el) => {
    const s = activeSession(); if (!s) return;
    const i = +el.dataset.ex, j = +el.dataset.set, e = s.exercises[i], x = e && e.sets[j];
    if (!x || x.done) return;
    const ghost = ghostFor(e.exId, s.dayKey, s.id), g = ghost ? ghost.sets[j] : null;
    if (!g) return;
    x.kg = kgStr(num(g.kg) || 0); x.reps = String(g.reps);
    save(); rerenderCard(i);
  },
  addSet: (el) => {
    const s = activeSession(); if (!s) return;
    const i = +el.dataset.ex;
    s.exercises[i].sets.push(newSet());
    save(); rerenderCard(i); updateWorkoutProgress();
  },
  removeSet: (el) => {
    const s = activeSession(); if (!s) return;
    const i = +el.dataset.ex, sets = s.exercises[i].sets;
    if (sets.length <= 1) { toast(t('toast_one_set_min'), 'err'); return; }
    if (sets[sets.length - 1].done) { toast(t('toast_reopen_last'), 'err'); return; }
    sets.pop(); save(); rerenderCard(i); updateWorkoutProgress();
  },
  openExercise: (el) => openExerciseSheet(el.dataset.ex, el.dataset.back),
  openWarmup: (el) => {
    const s = activeSession(); if (!s) return;
    const i = +el.dataset.ex, e = s.exercises[i];
    let w = num(e.sets[0] && e.sets[0].kg);
    if (!Number.isFinite(w)) w = defaultKgFor(s, i, 0);
    S.tools.warmWeight = w; S.tools.warmMode = 'bar'; save();
    Modal.open(`${sheetHeader(t('warmup'), exName(e.exId))}<div class="mt-4">${warmupPanel()}</div>`, { label: t('warmup') });
  },
  openPlates: (el) => {
    const s = activeSession(); if (!s) return;
    const i = +el.dataset.ex, e = s.exercises[i], ex = EX[e.exId];
    let w = num(e.sets[0] && e.sets[0].kg);
    if (!Number.isFinite(w)) w = defaultKgFor(s, i, 0);
    const vest = S.settings.vestKg, barKg = toKg(plateSet().bar);
    if (ex.load === 'barvest' && w - vest >= barKg - 0.01) { w -= vest; S.tools.vestOn = true; } else S.tools.vestOn = false;
    S.tools.plateTarget = w; save();
    Modal.open(`${sheetHeader(t('load_plates'), exName(e.exId))}<div class="mt-4">${platesPanel()}</div>`, { label: t('load_plates') });
  },
  timerStart: (el) => Timer.start(+el.dataset.sec, t('rest_label')),
  timerAdd: (el) => Timer.add(+el.dataset.sec),
  timerStop: () => Timer.stop(),
  timerCustom: () => {
    const v = Math.round(num(S.tools.customTimer));
    if (!(v >= 5 && v <= 1800)) { toast(t('toast_timer_range'), 'err'); return; }
    Timer.start(v, t('custom_timer'));
  },
  habitCheck: (el) => toggleHabit(el.dataset.key),
  habitStep: (el) => stepHabit(el.dataset.key, Number(el.dataset.dir)),
  previewWorkout: (el) => openWorkoutPreview(el.dataset.day),
  toolTab: (el) => { S.tools.tab = el.dataset.tool; save(); render(); },
  plateStep: (el) => {
    const ps = plateSet();
    let v = roundDisp(toDisp(num(S.tools.plateTarget)));
    if (!Number.isFinite(v)) v = ps.bar;
    v = clamp(v + Number(el.dataset.dir) * plateStepSize(), ps.bar, Math.max(ps.bar, maxLoad()));
    S.tools.plateTarget = toKg(v); save(); refreshPlates();
  },
  plateInv: (el) => {
    const p = plateSet().inv[+el.dataset.idx]; if (!p) return;
    p.count = clamp(p.count + Number(el.dataset.dir), 0, 40);
    save(); refreshPlates();
  },
  vestToggle: () => { S.tools.vestOn = !S.tools.vestOn; save(); refreshPlates(); },
  warmMode: (el) => { S.tools.warmMode = el.dataset.mode; save(); refreshWarmup(); },
  warmStep: (el) => {
    let v = roundDisp(toDisp(num(S.tools.warmWeight))); if (!Number.isFinite(v)) v = 0;
    v = clamp(v + Number(el.dataset.dir) * (imperial() ? 5 : 2.5), 0, imperial() ? 1100 : 500);
    S.tools.warmWeight = toKg(v); save(); refreshWarmup();
  },
  rmStep: (el) => {
    const f = el.dataset.field, d = Number(el.dataset.dir);
    if (f === 'rmReps') {
      let v = num(S.tools.rmReps); if (!Number.isFinite(v)) v = 0;
      S.tools.rmReps = clamp(Math.round(v + d), 1, 30);
    } else {
      let v = roundDisp(toDisp(num(S.tools.rmWeight))); if (!Number.isFinite(v)) v = 0;
      v = clamp(v + d * (imperial() ? 5 : 2.5), 0, imperial() ? 1100 : 500);
      S.tools.rmWeight = toKg(v);
    }
    save();
    $$('[data-rm-panel]').forEach((n) => { n.outerHTML = rmPanel(); });
  },
  libFilter: (el) => { libFilter = el.dataset.group; render(); },
  saveBW: () => saveBodyweight(),
  deleteBW: (el) => { S.bodyweight = S.bodyweight.filter((e) => e.date !== el.dataset.date); save(); render(); },
  editProfile: () => openProfileSheet(),
  saveProfile: () => saveProfile(),
  toggleSetting: (el) => {
    const k = el.dataset.key;
    S.settings[k] = !S.settings[k]; save(); render();
    if (k === 'wakeLock') { if (S.settings.wakeLock) requestWakeLock(); else releaseWakeLock(); }
    if (k === 'sound' && S.settings.sound) unlockAudio();
  },
  setTheme: (el) => { S.settings.theme = el.dataset.value; save(); applySettings(); render(); },
  setAccent: (el) => { S.settings.accent = el.dataset.value; save(); applySettings(); render(); },
  setRoseMode: (el) => { S.settings.roseMode = el.dataset.value; save(); applySettings(); render(); },
  setUnits: (el) => {
    if (S.settings.units === el.dataset.value) return;
    S.settings.units = el.dataset.value; bwDraft = ''; save(); applySettings(); render();
    toast(t('toast_units', { u: imperial() ? 'lb, in' : 'kg, cm' }), 'ok');
  },
  setLang: (el) => { S.settings.lang = el.dataset.value; save(); applySettings(); render(); },
  newMeso: () => confirmSheet({
    title: t('confirm_cycle_title'), text: t('confirm_cycle_text'),
    confirmLabel: t('start'), onConfirm: () => { S.settings.mesoStart = mondayOf(isoDate()); save(); render(); toast(t('toast_new_cycle'), 'ok'); }
  }),
  exportData: () => exportData(),
  shareData: () => shareData(),
  importData: () => $('#importInput').click(),
  resetAll: () => confirmSheet({
    title: t('confirm_reset_title'), text: t('confirm_reset_text'),
    confirmLabel: t('delete'), danger: true,
    onConfirm: () => {
      Timer.stop(); releaseWakeLock();
      const keep = { lang: S.settings.lang, units: S.settings.units };
      S = defaultState(); Object.assign(S.settings, keep);
      save(true); applySettings(); render();
      toast(t('toast_reset'));
    }
  }),
  install: async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch (e) { /* ignorieren */ }
    deferredPrompt = null; render();
  },
  closeModal: () => Modal.close(),
  confirmYes: () => {
    const fn = pendingConfirm; pendingConfirm = null;
    const token = modalToken;
    if (fn) fn();
    if (modalOpen && modalToken === token) Modal.close();
  }
};

/* ---------- Ereignisse ---------- */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, ev);
});

document.addEventListener('input', (ev) => {
  const el = ev.target;
  const kind = el.dataset ? el.dataset.input : null;
  if (!kind) return;
  if (kind === 'set') {
    const s = activeSession(); if (!s) return;
    const i = +el.dataset.ex, j = +el.dataset.set;
    const e = s.exercises[i], x = e && e.sets[j];
    if (!x) return;
    const raw = el.value.trim();
    if (el.dataset.field === 'kg') {
      const v = num(raw);
      if (raw === '') x.kg = ''; else if (Number.isFinite(v)) x.kg = kgStr(toKg(v));
    } else x.reps = raw;
    if (x.done) {
      const ghost = ghostFor(e.exId, s.dayKey, s.id), g = ghost ? ghost.sets[j] : null;
      x.beat = !!g && beats(num(x.kg) || 0, num(x.reps) || 0, num(g.kg) || 0, num(g.reps) || 0);
    }
    save();
  } else if (kind === 'toolW' || kind === 'tool') {
    const key = el.dataset.key, v = num(el.value);
    if (kind === 'toolW') S.tools[key] = Number.isFinite(v) ? toKg(v) : NaN;
    else S.tools[key] = Number.isFinite(v) ? v : el.value;
    save();
    if (key === 'plateTarget') $$('[data-plate-result]').forEach((n) => { n.innerHTML = plateResultHTML(); });
    if (key === 'warmWeight') $$('[data-warm-result]').forEach((n) => { n.innerHTML = warmResultHTML(); });
    if (key === 'rmWeight' || key === 'rmReps') $$('[data-rm-result]').forEach((n) => { n.innerHTML = rmResultHTML(); });
  } else if (kind === 'plates') {
    const v = num(el.value);
    if (Number.isFinite(v) && v >= 0 && v <= 250) {
      if (el.dataset.key === 'vest') S.settings.vestKg = toKg(v); else plateSet().bar = v;
      save();
      $$('[data-plate-result]').forEach((n) => { n.innerHTML = plateResultHTML(); });
      $$('[data-plate-meta]').forEach((n) => { n.textContent = plateMetaText(); });
    }
  } else if (kind === 'habitRange') {
    const k = el.dataset.key;
    if (habitBase === null) habitBase = computeProgress().xp;
    habitDay()[k] = Math.round(hToCanon(k, Number(el.value)) * 100) / 100;
    updateHabitRow(k);
    save();
  } else if (kind === 'libQuery') {
    libQuery = el.value;
    const list = $('#libList'); if (list) list.innerHTML = libraryListHTML();
  } else if (kind === 'bwDraft') {
    bwDraft = el.value;
  }
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.id === 'importInput') {
    const f = el.files && el.files[0];
    el.value = '';
    if (f) importFile(f);
    return;
  }
  const kind = el.dataset ? el.dataset.input : null;
  if (kind === 'habitRange') {
    const before = habitBase === null ? computeProgress().xp : habitBase;
    habitBase = null;
    habitCommit(before);
    return;
  }
  if (kind === 'weekmap') {
    S.settings.weekMap[+el.dataset.day] = el.value; save(); render();
  } else if (kind === 'mesoStart' && /^\d{4}-\d{2}-\d{2}$/.test(el.value)) {
    S.settings.mesoStart = el.value; save(); render();
  }
});

document.addEventListener('toggle', (ev) => {
  if (ev.target && ev.target.matches && ev.target.matches('details[data-inv]')) { S.tools.invOpen = ev.target.open; save(); }
}, true);

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && modalOpen) { Modal.close(); return; }
  const el = ev.target;
  if (ev.key !== 'Enter' || !el.dataset) return;
  if (el.dataset.input === 'set') {
    ev.preventDefault();
    if (el.dataset.field === 'kg') {
      const r = $(`[data-input="set"][data-ex="${el.dataset.ex}"][data-set="${el.dataset.set}"][data-field="reps"]`);
      if (r) r.focus();
    } else {
      el.blur();
      const s = activeSession();
      const x = s && s.exercises[+el.dataset.ex] && s.exercises[+el.dataset.ex].sets[+el.dataset.set];
      if (x && !x.done) toggleSet(+el.dataset.ex, +el.dataset.set);
    }
  } else if (el.dataset.input === 'bwDraft') {
    ev.preventDefault(); saveBodyweight();
  }
});

window.addEventListener('popstate', () => {
  if (ignoreNextPop) { ignoreNextPop = false; return; }
  if (modalOpen) { Modal.close(true); return; }
  if (currentTab !== 'home') setTab('home', { fromPop: true });
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    requestWakeLock();
    if (S.timer && S.timer.endAt <= Date.now()) Timer.finish(); else Timer.tick();
    tickElapsed();
  } else save(true);
});
window.addEventListener('pagehide', () => save(true));
document.addEventListener('pointerdown', unlockAudio, { once: true, passive: true });

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  if (currentTab === 'profile' && !modalOpen) render();
});
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast(t('toast_installed'), 'ok'); });

/* ---------- 10 · Start ---------- */
function registerSW() {
  if (PREVIEW || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const hadController = !!navigator.serviceWorker.controller;
  const go = () => navigator.serviceWorker.register('./sw.js').catch((err) => console.warn('Service Worker:', err));
  if (document.readyState === 'complete') go(); else window.addEventListener('load', go, { once: true });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) toast(t('toast_update'), 'info', 3000);
  });
}

function init() {
  S = load();
  applySettings();
  if (S.timer) {
    if (S.timer.endAt > Date.now()) Timer.ensureLoop();
    else S.timer = null;
  }
  save(true);
  history.replaceState({ apexRoot: true }, '');
  render();
  const startTab = new URLSearchParams(location.search).get('tab');
  if (startTab && startTab !== 'home' && TABS.includes(startTab)) setTab(startTab);
  syncLevel(false);
  requestWakeLock();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  setInterval(tickElapsed, 1000);
  initDownloads();
  registerSW();
}
init();
</script>
